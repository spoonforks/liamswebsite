<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Projects</title>
  <link rel="stylesheet" href="personal-projects.css?v=20260406h">
</head>
<body>
  <main class="projects-app">
    <a class="home-link" href="index.html?return=1" aria-label="Back Home"></a>

    <h1 class="sr-only">Personal Projects</h1>

    <section class="projects-stage" aria-label="Elevator project selector">
      <aside class="control-panel" aria-label="Elevator controls">
        <button class="floor-button" type="button" data-floor="3" aria-pressed="false" aria-controls="floor-3-panel">3</button>
        <button class="floor-button" type="button" data-floor="2" aria-pressed="false" aria-controls="floor-2-panel">2</button>
        <button class="floor-button" type="button" data-floor="1" aria-pressed="false" aria-controls="floor-1-panel">1</button>
      </aside>

      <section class="elevator-shell" id="elevator-shell" aria-live="polite">
        <div class="elevator-top-bar">
          <div class="elevator-indicator" aria-hidden="true">
            <span id="indicator-value">--</span>
          </div>
        </div>

        <div class="elevator-frame">
          <div class="cabin-backdrop">
            <div class="cabin-content">
              <section class="floor-panel-content" id="floor-1-panel" data-floor="1" hidden>
                <div class="placeholder-sheet placeholder-sheet--spotify">
                  <span class="sheet-label sheet-label--spotify">Audio</span>
                  <div class="sheet-frame sheet-frame--spotify">
                    <iframe
                      class="spotify-embed"
                      data-testid="embed-iframe"
                      style="border-radius:12px"
                      src="https://open.spotify.com/embed/artist/0QPdbVSFYJxlXJyLssumgh?utm_source=generator&theme=0"
                      width="100%"
                      height="352"
                      frameborder="0"
                      allowfullscreen
                      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                      loading="lazy"
                    ></iframe>
                  </div>
                </div>
              </section>

              <section class="floor-panel-content" id="floor-2-panel" data-floor="2" hidden>
                <div class="placeholder-sheet placeholder-sheet--spotify placeholder-sheet--visuals">
                  <span class="sheet-label sheet-label--spotify">Visual</span>
                  <div class="sheet-frame sheet-frame--spotify sheet-frame--visuals">
                    <div class="visual-grid" aria-label="Visual project gallery">
                      <figure class="visual-tile">
                        <img src="personalProjects/Visual/jupiterfinal.png" alt="Final Jupiter artwork">
                      </figure>
                      <figure class="visual-tile">
                        <img src="personalProjects/Visual/eenieMeenie.png" alt="Eenie Meenie artwork">
                      </figure>
                      <figure class="visual-tile visual-tile--wide">
                        <img src="personalProjects/Visual/papers1.png" alt="Paper collage artwork">
                      </figure>
                      <figure class="visual-tile">
                        <img src="personalProjects/Visual/gorillaRepellentArt.png" alt="Gorilla Repellent artwork">
                      </figure>
                      <figure class="visual-tile">
                        <img src="personalProjects/Visual/jup2.png" alt="Jupiter artwork variation">
                      </figure>
                      <figure class="visual-tile">
                        <img src="personalProjects/Visual/actionManArt.png" alt="Action Man artwork">
                      </figure>
                    </div>
                  </div>
                </div>
              </section>

              <section class="floor-panel-content" id="floor-3-panel" data-floor="3" hidden>
                <div class="placeholder-sheet placeholder-sheet--spotify placeholder-sheet--three-d">
                  <span class="sheet-label sheet-label--spotify">3D</span>
                  <div class="sheet-frame sheet-frame--spotify sheet-frame--three-d">
                    <div class="three-d-gallery" aria-label="3D project gallery">
                      <figure class="three-d-tile">
                        <img
                          class="three-d-media"
                          src="personalProjects/3D/midscheepsGroundFloor.png"
                          alt="Midscheeps ground floor 3D render"
                        >
                      </figure>
                      <figure class="three-d-tile three-d-tile--video">
                        <video
                          class="three-d-media"
                          src="personalProjects/3D/FINALDELFTGOLD.mov"
                          autoplay
                          muted
                          loop
                          playsinline
                        ></video>
                      </figure>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </div>

          <div class="elevator-door elevator-door-left" aria-hidden="true"></div>
          <div class="elevator-door elevator-door-right" aria-hidden="true"></div>
        </div>
      </section>
    </section>

  </main>

  <script src="personal-projects.js?v=20260327a"></script>
</body>
</html>
